name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p false-ui --all-targets --no-deps -- -D warnings

      - name: Tests
        run: cargo test -p false-ui --lib

      - name: Version and frontend guardrails
        run: |
          node scripts/sync-version.mjs --check
          node scripts/check-frontend.mjs

      - name: Release build
        run: cargo build --release -p false-ui
