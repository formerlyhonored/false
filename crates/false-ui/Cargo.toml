[package]
name = "false-ui"
version = "0.1.3"
edition = "2021"
authors = ["zaidi"]
description = "False Browser - native shell and pure-Rust rendering workbench"
default-run = "false-ui"

[lib]
name = "false_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "false-ui"
path = "src/main.rs"

[dependencies]
false-engine = { path = "../false-engine" }
false-core = { path = "../false-core" }
tauri = { version = "2.0.0", features = ["unstable"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.21"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
png = "0.18"
discord-rich-presence = "0.2"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.0", features = ["rust_backend"] }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[features]
devtools = ["tauri/devtools"]
